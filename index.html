<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokémon Base Set Pack Opener</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0c10;
      --surface:   #13141a;
      --border:    #2a2b35;
      --gold:      #f0c040;
      --gold-dim:  #7a6010;
      --red:       #e63946;
      --text:      #e8e8f0;
      --muted:     #6b6c80;
      --rare:      #f0c040;
      --uncommon:  #a8c8e8;
      --common:    #c8c8c8;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      padding: 28px 0 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #13141a 0%, transparent 100%);
    }
    header h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 900;
      letter-spacing: .04em;
      color: var(--gold);
      text-transform: uppercase;
    }
    header p {
      margin-top: 6px;
      font-size: .8rem;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 40px 24px 80px;
      flex: 1;
    }

    /* ── Pack Selection Screen ── */
    #pack-select {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    #pack-select h2 {
      font-family: 'Unbounded', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pack-grid {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pack-choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: transform .2s;
    }
    .pack-choice:hover { transform: translateY(-6px); }
    .pack-choice img {
      width: 160px;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.7);
      border: 2px solid var(--border);
      transition: border-color .2s, box-shadow .2s;
    }
    .pack-choice:hover img {
      border-color: var(--gold);
      box-shadow: 0 12px 40px rgba(240,192,64,.25);
    }
    .pack-choice span {
      font-family: 'Unbounded', sans-serif;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pack-choice:hover span { color: var(--gold); }

    /* ── Opening Screen ── */
    #opening-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* progress bar */
    .progress-bar {
      width: 100%;
      max-width: 420px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      transition: width .3s ease;
    }
    .progress-label {
      font-size: .75rem;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* card display */
    .card-display {
      position: relative;
      width: 280px;
    }
    .card-display img {
      width: 100%;
      border-radius: 14px;
      box-shadow: 0 16px 60px rgba(0,0,0,.8);
      display: block;
    }
    .rarity-badge {
      position: absolute;
      top: -12px;
      right: -12px;
      font-family: 'Unbounded', sans-serif;
      font-size: .55rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1.5px solid;
    }
    .badge-rare    { background: rgba(240,192,64,.15); color: var(--rare);     border-color: var(--rare); }
    .badge-uncommon{ background: rgba(168,200,232,.15); color: var(--uncommon); border-color: var(--uncommon); }
    .badge-common  { background: rgba(200,200,200,.12); color: var(--common);   border-color: var(--common); }

    .card-name {
      text-align: center;
      margin-top: 16px;
      font-family: 'Unbounded', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      color: var(--text);
    }

    /* buttons */
    .btn {
      font-family: 'Unbounded', sans-serif;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 14px 36px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: background .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-gold {
      background: var(--gold);
      color: #0b0c10;
    }
    .btn-gold:hover { background: #f5d060; }
    .btn-outline {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--muted); color: var(--text); }

    .btn-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── All Cards Tray (shown after last card) ── */
    #summary-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    #summary-screen h2 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .card-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 760px;
    }
    .card-tray img {
      width: 100px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.6);
      transition: transform .15s;
      cursor: default;
    }
    .card-tray img:hover { transform: scale(1.08); }

    /* ── Upgrades ── */
    .badge-holo { background: rgba(255,120,220,.15); color: #ff9ff3; border-color: #ff9ff3; }

    .card-display { perspective: 900px; }
    .card-display img.flip { animation: reveal .45s ease; }
    @keyframes reveal {
      from { transform: rotateY(90deg) scale(.9); opacity: 0; }
      to   { transform: rotateY(0) scale(1);      opacity: 1; }
    }

    .card-display.rare img { box-shadow: 0 16px 60px rgba(240,192,64,.3); }
    .card-display.holo img { box-shadow: 0 16px 60px rgba(255,150,230,.4); }
    .card-display.holo::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.35) 40%,
                  rgba(120,200,255,.25) 50%, rgba(255,150,230,.25) 60%, transparent 80%);
      background-size: 200% 200%;
      mix-blend-mode: color-dodge;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-tray img.tier-holo { outline: 2px solid #ff9ff3; outline-offset: 2px; }
    .card-tray img.tier-rare { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* ── Card Index ── */
    .index-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 1.2rem;
      cursor: pointer;
      transition: border-color .2s, transform .15s;
    }
    .index-btn:hover { border-color: var(--gold); transform: scale(1.08); }

    #index-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.85);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 24px;
    }
    .index-panel {
      width: 100%;
      max-width: 1000px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    .index-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .index-top h2 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .index-close {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }
    .index-close:hover { color: var(--text); border-color: var(--muted); }

    .set-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .set-tab {
      font-family: 'Unbounded', sans-serif;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .set-tab.active { border-color: var(--gold); color: var(--gold); }

    .index-count {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 18px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .index-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 14px;
    }
    .index-card { position: relative; text-align: center; }
    .index-card img {
      width: 100%;
      border-radius: 8px;
      display: block;
      min-height: 150px;
      background: #1a1b25;
    }
    .index-card:not(.owned) img { filter: brightness(0); }
    .index-card.owned img { box-shadow: 0 4px 16px rgba(0,0,0,.6); }
    .index-card .num {
      margin-top: 6px;
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: .05em;
    }
    .index-card.owned .num { color: var(--text); }
    .index-card .qty {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--gold);
      color: #0b0c10;
      font-size: .6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* hidden util */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>Pokémon TCG — Base Set</h1>
  <p>Pack Opener</p>
</header>

<button class="index-btn" onclick="openIndex()" title="Card Index">📖</button>

<div id="index-overlay" class="hidden">
  <div class="index-panel">
    <div class="index-top">
      <h2>Card Index</h2>
      <button class="index-close" onclick="closeIndex()">✕</button>
    </div>
    <div class="set-tabs" id="set-tabs"></div>
    <div class="index-count" id="index-count"></div>
    <div class="index-grid" id="index-grid"></div>
  </div>
</div>

<main>

  <!-- SCREEN 1: Pick a pack -->
  <section id="pack-select">
    <h2>Choose a pack to open</h2>
    <div class="pack-grid">
      <div class="pack-choice" onclick="startOpening('Blastoise')">
        <img src="BlastoisePack_BS.png" alt="Blastoise Pack"
             onerror="this.style.background='#1a1b25';this.style.height='220px';this.alt='Blastoise Pack'">
        <span>Blastoise</span>
      </div>
      <div class="pack-choice" onclick="startOpening('Charizard')">
        <img src="CharizardPack_BS.png" alt="Charizard Pack"
             onerror="this.style.background='#1a1b25';this.style.height='220px'">
        <span>Charizard</span>
      </div>
      <div class="pack-choice" onclick="startOpening('Venusaur')">
        <img src="VenusaurPack_BS.png" alt="Venusaur Pack"
             onerror="this.style.background='#1a1b25';this.style.height='220px'">
        <span>Venusaur</span>
      </div>
    </div>
  </section>

  <!-- SCREEN 2: Reveal cards one by one -->
  <section id="opening-screen">
    <div class="progress-label" id="progress-label">Card 1 of 11</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="card-display">
      <img id="card-img" src="" alt="Card">
      <div class="rarity-badge" id="rarity-badge"></div>
    </div>

    <div class="card-name" id="card-name"></div>

    <div class="btn-row">
      <button class="btn btn-gold" id="next-btn" onclick="nextCard()">Next Card →</button>
      <button class="btn btn-outline" onclick="resetToMenu()">← Back to Packs</button>
    </div>
  </section>

  <!-- SCREEN 3: Summary of all pulled cards -->
  <section id="summary-screen">
    <h2>Pack opened!</h2>
    <div class="card-tray" id="card-tray"></div>
    <div class="btn-row">
      <button class="btn btn-gold" onclick="resetToMenu()">Open Another Pack</button>
    </div>
  </section>

</main>

<script>
  // ── Base Set card data ──────────────────────────────────────────────
  // Numbers 1–102, name + rarity tier
  // Rares: 1–16 | Uncommons: 17–64 | Commons: 65–102
const CARDS = [
  { n:1,  name:"Alakazam" },        { n:2,  name:"Blastoise" },
  { n:3,  name:"Chansey" },         { n:4,  name:"Charizard" },
  { n:5,  name:"Clefairy" },        { n:6,  name:"Gyarados" },
  { n:7,  name:"Hitmonchan" },      { n:8,  name:"Machamp" },
  { n:9,  name:"Magneton" },        { n:10, name:"Mewtwo" },
  { n:11, name:"Nidoking" },        { n:12, name:"Ninetales" },
  { n:13, name:"Poliwrath" },       { n:14, name:"RaichuBase" },
  { n:15, name:"Venusaur" },        { n:16, name:"Zapdos" },
  { n:17, name:"Beedrill" },        { n:18, name:"Dragonair" },
  { n:19, name:"Dugtrio" },         { n:20, name:"Electabuzz" },
  { n:21, name:"Electrode" },       { n:22, name:"Pidgeotto" },
  { n:23, name:"Arcanine" },        { n:24, name:"Charmeleon" },
  { n:25, name:"Dewgong" },         { n:26, name:"Dratini" },
  { n:27, name:"Farfetchd" },       { n:28, name:"Growlithe" },
  { n:29, name:"Haunter" },         { n:30, name:"Ivysaur" },
  { n:31, name:"JynxBase" },        { n:32, name:"Kadabra" },
  { n:33, name:"Kakuna" },          { n:34, name:"Machoke" },
  { n:35, name:"Magikarp" },        { n:36, name:"Magmar" },
  { n:37, name:"Nidorino" },        { n:38, name:"Poliwhirl" },
  { n:39, name:"Porygon" },         { n:40, name:"Raticate" },
  { n:41, name:"Seel" },            { n:42, name:"Wartortle" },
  { n:43, name:"Abra" },            { n:44, name:"Bulbasaur" },
  { n:45, name:"Caterpie" },        { n:46, name:"Charmander" },
  { n:47, name:"Diglett" },         { n:48, name:"Doduo" },
  { n:49, name:"Drowzee" },         { n:50, name:"Gastly" },
  { n:51, name:"Koffing" },         { n:52, name:"Machop" },
  { n:53, name:"Magnemite" },       { n:54, name:"Metapod" },
  { n:55, name:"Nidoran" },         { n:56, name:"Onix" },
  { n:57, name:"Pidgey" },          { n:58, name:"Pikachu" },
  { n:59, name:"Poliwag" },         { n:60, name:"Ponyta" },
  { n:61, name:"Rattata" },         { n:62, name:"Sandshrew" },
  { n:63, name:"Squirtle" },        { n:64, name:"Starmie" },
  { n:65, name:"Staryu" },          { n:66, name:"Tangela" },
  { n:67, name:"Voltorb" },         { n:68, name:"Vulpix" },
  { n:69, name:"Weedle" },          { n:70, name:"ClefairyDoll" },
  { n:71, name:"ComputerSearch" },  { n:72, name:"DevolutionSpray" },
  { n:73, name:"ImposterProfessorOak" }, { n:74, name:"ItemFinder" },
  { n:75, name:"Lass" },            { n:76, name:"PokemonBreeder" },
  { n:77, name:"PokemonTrader" },   { n:78, name:"ScoopUp" },
  { n:79, name:"SuperEnergyRemoval" }, { n:80, name:"Defender" },
  { n:81, name:"EnergyRetrieval" }, { n:82, name:"FullHeal" },
  { n:83, name:"Maintenance" },     { n:84, name:"PlusPower" },
  { n:85, name:"PokemonCenter" },   { n:86, name:"Pokemon_Flute" },
  { n:87, name:"Pokedex" },         { n:88, name:"Professor_Oak" },
  { n:89, name:"Revive" },          { n:90, name:"SuperPotion" },
  { n:91, name:"Bill" },            { n:92, name:"EnergyRemoval" },
  { n:93, name:"GustOfWind" },      { n:94, name:"Potion" },
  { n:95, name:"Switch" },          { n:96, name:"DoubleColorlessEnergy" },
  { n:97, name:"FightingEnergy" },  { n:98, name:"FireEnergy" },
  { n:99, name:"GrassEnergy" },     { n:100,name:"LightningEnergy" },
  { n:101,name:"PsychicEnergy" },   { n:102,name:"WaterEnergy" },
];

  // pad number to 3 digits just in case — adjust if your files are not zero-padded
  const CARD_DIR = 'Base Set/';

  function cardFilename(num, name) {
    const safeName = name.replace(/[♀♂]/g, '').replace(/[^a-zA-Z0-9_\- ']/g, '').trim().replace(/ /g, '_');
    return encodeURI(`${CARD_DIR}${num}_${safeName}_BS.jpg`);
  }

  function getTier(n) {
    if (n <= 16) return 'holo';
    if (n <= 22 || (n >= 70 && n <= 79)) return 'rare';
    if ((n >= 23 && n <= 42) || (n >= 80 && n <= 90) || n === 96) return 'uncommon';
    return 'common';
  }

  function getRarity(n) {
    const t = getTier(n);
    if (t === 'holo')     return { tier: t, label: 'Holo Rare ★', cls: 'badge-holo' };
    if (t === 'rare')     return { tier: t, label: 'Rare ★',      cls: 'badge-rare' };
    if (t === 'uncommon') return { tier: t, label: 'Uncommon ◆',  cls: 'badge-uncommon' };
    return                       { tier: t, label: 'Common ●',    cls: 'badge-common' };
  }

  // ── Pack logic ──────────────────────────────────────────────────────
  const HOLOS     = CARDS.filter(c => getTier(c.n) === 'holo');
  const NONHOLO_R = CARDS.filter(c => getTier(c.n) === 'rare');
  const UNCOMMONS = CARDS.filter(c => getTier(c.n) === 'uncommon');
  const ENERGIES  = CARDS.filter(c => c.n >= 97 && c.n <= 102);
  const COMMONS   = CARDS.filter(c => getTier(c.n) === 'common' && c.n < 97);

  function pickRandom(arr, count) {
    const pool = [...arr];
    const picked = [];
    for (let i = 0; i < count; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    return picked;
  }

function buildPack() {
  // 33% chance of a holo, 67% chance of a non-holo rare
  let rare;
  if (Math.random() < 0.33) {
    rare = pickRandom(HOLOS, 1);
  } else {
    rare = pickRandom(NONHOLO_R, 1);
  }
  const uncommons = pickRandom(UNCOMMONS, 3);
  const commons   = pickRandom(COMMONS, 6);
  const energy    = pickRandom(ENERGIES, 1);
  return [...energy, ...commons, ...uncommons, ...rare];
}

  // ── State ───────────────────────────────────────────────────────────
  let currentPack = [];
  let currentIdx  = 0;

  // ── Screens ─────────────────────────────────────────────────────────
  function show(id) {
    ['pack-select','opening-screen','summary-screen'].forEach(s => {
      document.getElementById(s).style.display = 'none';
    });
    document.getElementById(id).style.display = 'flex';
  }

  function startOpening(packName) {
    currentPack = buildPack();
    currentPack.forEach(c => { new Image().src = cardFilename(c.n, c.name); });
    currentIdx  = 0;
    show('opening-screen');
    showCard(currentIdx);
  }

  function showCard(idx) {
    const card   = currentPack[idx];
    const total  = currentPack.length;
    const rarity = getRarity(card.n);

    document.getElementById('progress-label').textContent = `Card ${idx+1} of ${total}`;
    document.getElementById('progress-fill').style.width  = `${((idx+1)/total)*100}%`;

    const img = document.getElementById('card-img');
    img.classList.remove('flip'); void img.offsetWidth; img.classList.add('flip');
    img.onerror = () => console.warn('Missing image:', img.src);
    img.src   = cardFilename(card.n, card.name);
    img.alt   = card.name;

    const disp = document.querySelector('.card-display');
    disp.classList.remove('holo', 'rare');
    if (rarity.tier === 'holo') disp.classList.add('holo');
    else if (rarity.tier === 'rare') disp.classList.add('rare');

    document.getElementById('card-name').textContent = card.name;
    markOwned('base', card.n);

    const badge = document.getElementById('rarity-badge');
    badge.textContent  = rarity.label;
    badge.className    = `rarity-badge ${rarity.cls}`;

    const btn = document.getElementById('next-btn');
    if (idx === total - 1) {
      btn.textContent = 'See All Cards ✦';
    } else {
      btn.textContent = 'Next Card →';
    }
  }

  function nextCard() {
    if (currentIdx < currentPack.length - 1) {
      currentIdx++;
      showCard(currentIdx);
    } else {
      showSummary();
    }
  }

  function showSummary() {
    show('summary-screen');
    const tray = document.getElementById('card-tray');
    tray.innerHTML = '';
    currentPack.forEach(card => {
      const img = document.createElement('img');
      img.src   = cardFilename(card.n, card.name);
      img.alt   = card.name;
      img.title = card.name;
      img.className = 'tier-' + getTier(card.n);
      tray.appendChild(img);
    });
  }

  function resetToMenu() {
    show('pack-select');
  }

  document.addEventListener('keydown', e => {
    const opening = document.getElementById('opening-screen').style.display === 'flex';
    const indexOpen = !document.getElementById('index-overlay').classList.contains('hidden');
    if (opening && !indexOpen && (e.key === 'ArrowRight' || e.key === ' ')) {
      e.preventDefault();
      nextCard();
    }
  });

  // ── Collection / Index ──────────────────────────────────────────────
  // To add a set later: push another object here with its own cards + folder
  const SETS = [
    { id: 'base', name: 'Base Set', cards: CARDS }
  ];
  let activeSet = 'base';

  function loadCollection() {
    try { return JSON.parse(localStorage.getItem('tcg-collection')) || {}; }
    catch { return {}; }
  }
  function saveCollection() {
    try { localStorage.setItem('tcg-collection', JSON.stringify(collection)); } catch {}
  }
  let collection = loadCollection();

  function markOwned(setId, n) {
    collection[setId] = collection[setId] || {};
    collection[setId][n] = (collection[setId][n] || 0) + 1;
    saveCollection();
  }

  function renderIndex() {
    const set   = SETS.find(s => s.id === activeSet);
    const owned = collection[set.id] || {};
    const have  = set.cards.filter(c => owned[c.n]).length;

    const tabs = document.getElementById('set-tabs');
    tabs.innerHTML = '';
    SETS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'set-tab' + (s.id === activeSet ? ' active' : '');
      b.textContent = s.name;
      b.onclick = () => { activeSet = s.id; renderIndex(); };
      tabs.appendChild(b);
    });

    document.getElementById('index-count').textContent =
      `${set.name}: ${have} / ${set.cards.length} collected`;

    const grid = document.getElementById('index-grid');
    grid.innerHTML = '';
    set.cards.forEach(c => {
      const qty = owned[c.n] || 0;
      const div = document.createElement('div');
      div.className = 'index-card' + (qty ? ' owned' : '');
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = cardFilename(c.n, c.name);
      img.alt = qty ? c.name : 'Unknown card';
      div.appendChild(img);
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = qty ? `#${c.n} ${c.name}` : `#${c.n} ???`;
      div.appendChild(num);
      if (qty > 1) {
        const q = document.createElement('div');
        q.className = 'qty';
        q.textContent = '×' + qty;
        div.appendChild(q);
      }
      grid.appendChild(div);
    });
  }

  function openIndex() {
    renderIndex();
    document.getElementById('index-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeIndex() {
    document.getElementById('index-overlay').classList.add('hidden');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeIndex(); });

  // init
  show('pack-select');
</script>
</body>
</html>
